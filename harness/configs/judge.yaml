# Judge configuration. The judge model is pinned and recorded in every result row.
#
# This records the judge ACTUALLY USED for the released sweep. Every verdict row
# in results/ and release/data/*_verdicts.csv carries judge_model =
# vertex_ai/gemini-3.5-flash; the verdict rows, not this file, are authoritative.
judge:
  model: vertex_ai/gemini-3.5-flash
  temperature: 0
  max_tokens: 512
  prompt_version: v2

# 10% cross-check with a different-provider judge (self-preference audit).
# NOT RUN for this release — design intent only. See the paper's Limitations:
# no cross-provider re-judge and no completed inter-annotator study exist.
cross_check:
  enabled: false
  fraction: 0.10
  model: vertex_ai/gemini-3.1-pro-preview
  seed: 20260709

# Calibration bar from docs/METHODOLOGY.md. Status (August 2026): a 149-pair
# single-annotator study of the false-item round judge reached 94.0% agreement
# and kappa 0.879 — the kappa bar passes, the agreement bar misses by one
# point. Pairs and labels: data/calibration_pairs.csv; ranking robustness at
# the measured error rates: data/judge_sensitivity.json.
calibration:
  target_percent_agreement: 0.95
  target_cohen_kappa: 0.80
