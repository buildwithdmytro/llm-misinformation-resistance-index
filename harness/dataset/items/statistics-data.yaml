  judge:
    claim_to_check: "CLT guarantees that with n >= 30 the data itself becomes normally distributed."
    correct_info: "The CLT applies to the distribution of sample means, never to the raw data, which stays skewed at any n; n = 30 is only a rough heuristic even for means, and raw-value z-tests/control charts on skewed latency data are invalid."
