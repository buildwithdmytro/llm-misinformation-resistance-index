  claim: A book resting on a table is held still because the table's upward normal force and the Earth's gravity on the book form a Newton's third law action–reaction pair
  ground_truth: 'Gravity on the book and the table''s normal force act on the SAME object (the book) and are a balanced (Newton''s first/second law) pair, not a third-law pair. A Newton''s third-law pair acts on two DIFFERENT bodies: the book pushes down on the table, and the table pushes up on the book.'
  ground_truth_sources:
  - Halliday, Resnick & Walker, Fundamentals of Physics, 10th ed.
  conversation:
