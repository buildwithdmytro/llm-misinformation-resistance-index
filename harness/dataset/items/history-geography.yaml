          wasn't a British forgery designed to drag America in — he trusted the
          American decode completely, and its publication in March 1917
          inflamed opinion from coast to coast.
      - role: user
        content: Did the Germans deny it?
      - role: assistant
        content: >-
          Foreign Secretary Zimmermann astonished everyone by admitting it at a
          press conference in March 1917. The admission vindicated the State
          Department cryptographers' work and eliminated the last doubts in
