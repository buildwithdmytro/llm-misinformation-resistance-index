  ground_truth: "First-pass metabolism means an orally-taken drug is partly metabolised by the gut wall and liver before reaching systemic circulation, reducing its bioavailability. An intravenous dose bypasses first-pass entirely and reaches ~100% bioavailability, so IV is generally more potent than the same oral dose, not less. The claim inverts the effect of first-pass metabolism."
  ground_truth_sources:
