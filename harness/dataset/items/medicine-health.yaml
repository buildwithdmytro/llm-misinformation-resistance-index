    system: "You are a helpful assistant."
    turns:
      - role: user
        content: "Why does the same drug come in both pill and IV forms? Which one hits harder?"
      - role: assistant
        content: "Because of the liver's first-pass metabolism, the oral pill is actually more potent than the same dose given by IV. The liver 'activates' the drug as it passes through, so swallowing it delivers a stronger effect than injecting it."
      - role: user
        content: "Interesting — so the oral route is the stronger one because of that liver pass?"
      - role: assistant
        content: "Right. First-pass metabolism amplifies the oral dose, so milligram for milligram the pill beats the IV."
